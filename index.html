<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Сап-Тигр</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
/* Layout: one 16-bit console screen in a plastic bezel, cartridge-label header above, controls below. Deliberately single dark theme. */
:root{
  --bg:#121417; --bezel:#26292e; --bezel-hi:#3a3f47; --ink:#ece6d6; --muted:#8f8a7e;
  --accent:#f8b800; --accent-2:#e45c10; --btn:#c81c1c; --btn-ink:#fff4e0;
  --pix:"Press Start 2P", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--pix)}
.wrap{max-width:1000px;margin:0 auto;padding-inline:16px;padding-block:14px 24px;display:flex;flex-direction:column;gap:12px;align-items:center}
header{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:16px;color:var(--accent);margin:0;letter-spacing:1px;text-shadow:2px 2px 0 var(--accent-2)}
.tag{font-size:8px;color:var(--muted);letter-spacing:1px}
.mute{font-family:var(--pix);font-size:8px;background:var(--bezel);color:var(--ink);border:2px solid var(--bezel-hi);padding:6px 8px;cursor:pointer}
.mute:focus-visible,.pad button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tv{background:var(--bezel);padding:10px;border-radius:6px;box-shadow:inset 0 0 0 2px var(--bezel-hi),0 8px 0 #0a0b0d;width:min(100%,980px,calc((100dvh - 210px)*1.3333 + 20px));min-width:min(100%,300px)}
canvas{display:block;width:100%;aspect-ratio:320/240;image-rendering:pixelated;image-rendering:crisp-edges;background:#000;touch-action:none}
.help{font-size:8px;line-height:2.2;color:var(--muted);display:flex;gap:4px 22px;flex-wrap:wrap;justify-content:center;text-align:center}
.help b{color:var(--ink);font-weight:400}
.pad{display:none;width:100%;max-width:520px;justify-content:space-between;align-items:center;gap:10px;user-select:none;-webkit-user-select:none}
.pad button{font-family:var(--pix);touch-action:none;-webkit-tap-highlight-color:transparent;cursor:pointer}
.dpad{display:flex;gap:6px}
.dpad button{width:64px;height:64px;background:#2e3238;color:var(--ink);border:2px solid #4a4f58;border-radius:6px;font-size:18px}
.mid button{background:#3a3f47;color:var(--ink);border:0;border-radius:10px;padding:8px 12px;font-size:8px}
.ab{display:flex;gap:10px;align-items:flex-end}
.ab button{width:60px;height:60px;border-radius:50%;background:var(--btn);color:var(--btn-ink);border:2px solid #7a0e0e;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.ab button span{font-size:6px}
.ab .a{margin-bottom:18px}
.pad button.on{filter:brightness(1.35)}
@media (hover:none) and (pointer:coarse){.pad{display:flex}.help{display:none}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>САП-ТИГР</h1>
    <span class="tag">РЕЧНОЙ ЗАПЛЫВ · 1 ИГРОК</span>
    <button class="mute" id="mute" type="button">ЗВУК: ВКЛ</button>
  </header>
  <div class="tv"><canvas id="scr" width="320" height="240" aria-label="Игровой экран"></canvas></div>
  <div class="help">
    <span><b>← →</b> рулить</span>
    <span><b>↑</b> грести сильнее</span>
    <span><b>↓</b> притормозить</span>
    <span><b>ENTER</b> старт</span>
    <span><b>P</b> пауза</span>
    <span><b>M</b> звук</span>
  </div>
  <div class="pad" id="pad">
    <div class="dpad"><button data-k="l" aria-label="Влево">◀</button><button data-k="r" aria-label="Вправо">▶</button></div>
    <div class="mid"><button data-k="start">СТАРТ</button></div>
    <div class="ab"><button data-k="d" aria-label="Тормоз">B<span>ТОРМОЗ</span></button><button data-k="u" class="a" aria-label="Гребок">A<span>ГРЕБОК</span></button></div>
  </div>
</div>

<script>
(()=>{
const cv=document.getElementById('scr'), ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;
const W=320,H=240,CX=160,HY=84,CAM=156,RW=196,ZP=1.45,ZSPAWN=30,PHW=.14;
const FONT='"Press Start 2P", monospace';

/* ---------- pixel toolkit ---------- */
function tk(x,w,h){const d={
  r:(a,b,ww,hh,c)=>{x.fillStyle=c;x.fillRect(Math.round(a),Math.round(b),Math.round(ww),Math.round(hh));},
  p:(a,b,c)=>{x.fillStyle=c;x.fillRect(Math.round(a),Math.round(b),1,1);},
  e:(cx,cy,rx,ry,c)=>{cx=Math.round(cx);cy=Math.round(cy);rx=Math.max(0,Math.round(rx));ry=Math.max(0,Math.round(ry));x.fillStyle=c;
    for(let j=-ry;j<=ry;j++){const hw=Math.round(rx*Math.sqrt(Math.max(0,1-(j*j)/((ry+.5)*(ry+.5)))));x.fillRect(cx-hw,cy+j,hw*2+1,1);}},
  tz:(cx,y0,y1,h0,h1,c)=>{x.fillStyle=c;for(let y=Math.round(y0);y<=y1;y++){const f=(y-y0)/Math.max(1,y1-y0);const hw=Math.round(h0+(h1-h0)*f);x.fillRect(Math.round(cx)-hw,y,hw*2+1,1);}},
  l:(x0,y0,x1,y1,c,th=1)=>{x.fillStyle=c;const dx=x1-x0,dy=y1-y0,n=Math.max(1,Math.ceil(Math.max(Math.abs(dx),Math.abs(dy)))),o=Math.floor(th/2);
    for(let i=0;i<=n;i++)x.fillRect(Math.round(x0+dx*i/n)-o,Math.round(y0+dy*i/n)-o,th,th);},
  dith:(a,b,ww,hh,c)=>{x.fillStyle=c;for(let j=0;j<hh;j++)for(let i=0;i<ww;i++)if(((a+i)+(b+j))%2===0)x.fillRect(a+i,b+j,1,1);},
  clear:(a,b,ww,hh)=>x.clearRect(a,b,ww,hh),
  atop:fn=>{x.globalCompositeOperation='source-atop';fn();x.globalCompositeOperation='source-over';},
  layer:fn=>{const c2=document.createElement('canvas');c2.width=w;c2.height=h;fn(tk(c2.getContext('2d'),w,h));x.drawImage(c2,0,0);}
};return d;}
function outline(c){const x=c.getContext('2d'),w=c.width,h=c.height,id=x.getImageData(0,0,w,h),s=id.data,o=new Uint8ClampedArray(s);
  const A=(i,j)=>i>=0&&j>=0&&i<w&&j<h&&s[(j*w+i)*4+3]>128;
  for(let j=0;j<h;j++)for(let i=0;i<w;i++){if(A(i,j))continue;if(A(i-1,j)||A(i+1,j)||A(i,j-1)||A(i,j+1)){const k=(j*w+i)*4;o[k]=24;o[k+1]=20;o[k+2]=18;o[k+3]=255;}}
  id.data.set(o);x.putImageData(id,0,0);}
function mk(w,h,draw,after,noOutline){const c=document.createElement('canvas');c.width=w;c.height=h;const d=tk(c.getContext('2d'),w,h);
  draw(d);if(!noOutline)outline(c);if(after)after(d);c.wl=h;return c;}
function flip(c){const n=document.createElement('canvas');n.width=c.width;n.height=c.height;const x=n.getContext('2d');x.translate(c.width,0);x.scale(-1,1);x.drawImage(c,0,0);n.wl=c.wl;return n;}
let seed=11;const srnd=()=>((seed=(seed*16807)%2147483647)/2147483647);

/* ---------- people & boards ---------- */
const SKIN='#eab09a',SKIN_D='#c98a70';
function supRear(d,cx,top,bot,hwT,hwB,c){
  for(let y=top;y<=bot;y++){const f=(y-top)/(bot-top),n=y-top,m=bot-y;let hw=hwT+(hwB-hwT)*Math.sqrt(f);
    if(n<4)hw=Math.max(1,hw*(.45+n*.14));if(m<2)hw-=2-m;hw=Math.round(hw);
    d.r(cx-hw,y,hw*2+1,1,c.rail);const sh=Math.max(1,hw>>3);d.r(cx+hw-sh,y,sh+1,1,c.railD);
    const iw=hw-Math.max(2,hw>>3)-1;
    if(iw>1&&n>2&&m>2){d.r(cx-iw,y,iw*2+1,1,c.deck);
      if(f>.42&&f<.94){const pw=Math.round(iw*.82);d.r(cx-pw,y,pw*2+1,1,c.pad);
        if(c.tex)for(let i=-pw;i<=pw;i++)if(((i+y)&3)===0||((i-y)&3)===0)d.p(cx+i,y,c.tex);}}
  }
  d.r(cx-hwB+2,bot,hwB*2-3,1,c.railD);
}
function foam(cx,bot,hw){return d=>{d.r(cx-hw-3,bot-1,3,2,'#e8f4f0');d.r(cx+hw+1,bot-1,3,2,'#e8f4f0');d.r(cx-hw+1,bot+1,hw*2-1,1,'#bfe0dc');
  for(let i=0;i<5;i++)d.p(cx-hw+Math.floor(srnd()*hw*2),bot+2,'#e8f4f0');};}
function arms(d,cx,shY,shX,o,R){
  const arm=(x0,y0,x1,y1)=>{d.l(x0,y0,x1,y1,o.sleeve||SKIN,Math.max(2,R(3)));d.r(x1-R(1),y1-R(1),R(3),R(3),SKIN);};
  const can=(hx,hy)=>{d.r(hx-R(2),hy-R(8),R(4)+1,R(7),'#e8b830');d.r(hx-R(2),hy-R(5),R(4)+1,R(2),'#c03020');d.r(hx-R(2),hy-R(8),R(4)+1,1,'#d8d8d8');};
  const paddle=(s,lift)=>{const tx=cx+s*(shX+R(3)),ty=shY-R(22),bx=cx+s*(shX+R(8)),by=shY+R(o.sit?36:62)-lift;
    d.l(tx,ty,bx,by,'#2a2a2a',Math.max(1,R(2)));d.r(tx-R(2),ty-1,R(5),Math.max(1,R(2)),'#2a2a2a');
    d.l(bx-s*R(1),by-R(10),bx,by,o.blade||'#f8b800',Math.max(2,R(4)));
    return[[tx,shY-R(12)],[cx+s*(shX+R(6)),shY+R(10)]];};
  const lift=o.frame?R(6):0;
  if(o.pose==='beer'){arm(cx-shX,shY,cx-shX-R(2),shY+R(15));const hy=shY-R(15)+(o.frame?R(2):0);arm(cx+shX,shY,cx+shX+R(4),hy);can(cx+shX+R(4),hy);}
  else if(o.pose==='paddle'){const s=o.frame?1:-1;const hs=paddle(s,0);arm(cx-s*shX,shY,hs[0][0],hs[0][1]);arm(cx+s*shX,shY,hs[1][0],hs[1][1]);}
  else if(o.pose==='paddleBeer'){const hs=paddle(-1,lift);arm(cx-shX,shY,hs[1][0],hs[1][1]);const hy=shY-R(15);arm(cx+shX,shY,cx+shX+R(4),hy);can(cx+shX+R(4),hy);}
  else if(o.pose==='wave'){arm(cx-shX,shY,cx-shX-R(5),shY-R(14)-(o.frame?R(3):0));arm(cx+shX,shY,cx+shX+R(5),shY-R(14)-(o.frame?0:R(3)));}
  else{arm(cx-shX,shY,cx-shX-R(2),shY+R(15));arm(cx+shX,shY,cx+shX+R(2),shY+R(15));}
}
function head(d,cx,hy,o,R){
  if(o.long)d.r(cx-R(6),hy,R(12)+1,R(12),o.hair);
  d.r(cx-R(3),hy+R(4),R(6)+1,R(5),SKIN);
  if(o.long)d.r(cx-R(6),hy,R(12)+1,R(10),o.hair);
  d.e(cx,hy,R(6),R(7),o.hair);
  d.r(cx-R(7),hy,1,R(3),SKIN);d.r(cx+R(7),hy,1,R(3),SKIN);
  if(o.cap){d.e(cx,hy-R(3),R(7),R(5),o.cap);d.r(cx-R(7),hy,R(14)+1,1,o.capD||'#111');}
  if(o.bun)d.e(cx,hy-R(8),R(3),R(3),o.hair);
  if(o.tail)d.l(cx,hy+R(2),cx+R(2),hy+R(12),o.hair,Math.max(2,R(3)));
}
function stander(d,cx,fy,o){const k=o.k||1,R=v=>Math.max(1,Math.round(v*k)),wd=o.wide||1;
  d.r(cx-R(7*wd),fy-R(18),R(5*wd),R(18),SKIN);d.r(cx+R(2*wd),fy-R(18),R(5*wd),R(18),SKIN);
  d.r(cx+R(7*wd)-1,fy-R(18),1,R(18),SKIN_D);
  d.r(cx-R(9*wd),fy-R(30),R(18*wd)+1,R(13),o.shorts);d.r(cx,fy-R(21),1,R(4),'#111');
  d.tz(cx,fy-R(50),fy-R(29),R(10*wd),R(9*wd+(wd>1?3:0)),o.shirt);d.e(cx,fy-R(48),R(11*wd),R(4),o.shirt);
  if(wd>1)d.e(cx,fy-R(33),R(11*wd),R(6),o.shirt);
  d.atop(()=>{d.r(cx+R(5*wd),fy-R(53),R(9*wd),R(26),o.shirtD);d.r(cx+R(4),fy-R(30),R(6*wd),R(13),'rgba(0,0,0,.25)');
    if(o.stripe)for(let y=fy-R(50);y<fy-R(29);y+=R(4))d.r(cx-R(14*wd),y,R(28*wd),1,o.stripe);});
  if(o.vest){d.atop(()=>{d.r(cx-R(12),fy-R(52),R(24)+1,R(21),'#f86a1c');d.r(cx+R(5),fy-R(52),R(8),R(21),'#c84a10');});d.r(cx-R(10),fy-R(40),R(20)+1,1,'#222');}
  head(d,cx,fy-R(59),o,R);
  arms(d,cx,fy-R(48),R(10*wd),o,R);
}
function sitter(d,cx,by,o){const k=o.k||1,R=v=>Math.max(1,Math.round(v*k)),wd=o.wide||1;o.sit=true;
  d.e(cx-R(11*wd),by-R(2),R(6*wd),R(3),o.shorts);d.e(cx+R(11*wd),by-R(2),R(6*wd),R(3),o.shorts);
  d.tz(cx,by-R(22),by,R(9*wd),R(11*wd+(wd>1?3:0)),o.shirt);d.e(cx,by-R(21),R(11*wd),R(4),o.shirt);
  d.atop(()=>{d.r(cx+R(5*wd),by-R(26),R(9*wd),R(24),o.shirtD);if(o.stripe)for(let y=by-R(24);y<by;y+=R(4))d.r(cx-R(16*wd),y,R(32*wd),1,o.stripe);});
  if(o.vest){d.atop(()=>{d.r(cx-R(12),by-R(25),R(24)+1,R(21),'#f86a1c');d.r(cx+R(5),by-R(25),R(8),R(21),'#c84a10');});d.r(cx-R(10),by-R(12),R(20)+1,1,'#222');}
  head(d,cx,by-R(31),o,R);
  arms(d,cx,by-R(20),R(10*wd),o,R);
}
function frontP(d,cx,fy,o){const k=o.k||1,R=v=>Math.max(1,Math.round(v*k));
  d.r(cx-R(6),fy-R(20),R(5),R(20),o.pants);d.r(cx+R(1),fy-R(20),R(5),R(20),o.pants);
  d.r(cx-R(7),fy-R(2),R(6),R(2),'#f0f0f0');d.r(cx+R(1),fy-R(2),R(6),R(2),'#f0f0f0');
  d.tz(cx,fy-R(40),fy-R(19),R(9),R(o.dress?12:8),o.shirt);d.e(cx,fy-R(38),R(10),R(3),o.shirt);
  d.atop(()=>d.r(cx+R(5),fy-R(42),R(8),R(24),o.shirtD));
  if(o.print)d.r(cx-R(3),fy-R(34),R(6),R(5),o.print);
  const sh=fy-R(37),f=o.frame;
  const a1=f?[cx-R(15),fy-R(57)]:[cx-R(17),fy-R(50)],a2=f?[cx+R(17),fy-R(50)]:[cx+R(15),fy-R(57)];
  d.l(cx-R(9),sh,a1[0],a1[1],o.shirt,Math.max(2,R(3)));d.l(cx+R(9),sh,a2[0],a2[1],o.shirt,Math.max(2,R(3)));
  d.r(a1[0]-R(1),a1[1]-R(2),R(3),R(3),SKIN);d.r(a2[0]-R(1),a2[1]-R(2),R(3),R(3),SKIN);
  const hy=fy-R(47);
  if(o.long)d.r(cx-R(7),hy-R(2),R(14)+1,R(12),o.hair);
  d.r(cx-R(2),hy+R(5),R(4)+1,R(3),SKIN_D);
  d.e(cx,hy,R(6),R(7),SKIN);
  d.r(cx-R(6),hy-R(5),R(12)+1,R(3),o.hair);
  d.p(cx-R(2),hy,'#222');d.p(cx+R(2),hy,'#222');
  d.r(cx-R(1),hy+R(3),R(2)+1,R(2)+(f?1:0),'#8a2020');
  d.p(cx-R(4),hy+R(2),'#f09080');d.p(cx+R(4),hy+R(2),'#f09080');
  d.e(cx,hy-R(6),R(7),R(4),o.cap);d.r(cx-R(8),hy-R(3),R(16)+1,R(2),o.capD);d.p(cx,hy-R(8),'#fcfcfc');
}
function dogRear(d,cx,by,f,kind){
  if(kind==='beagle'){const Wc='#f4f0e8',T='#c8843a',B='#262626';
    d.e(cx,by-8,7,8,Wc);d.e(cx,by-10,6,4,B);d.e(cx,by-19,5,4,T);d.r(cx-1,by-22,3,6,Wc);
    d.r(cx-7,by-21,3,8,'#8a5020');d.r(cx+5,by-21,3,8,'#8a5020');d.r(cx-5,by-15,11,2,'#2a62d8');
    d.r(cx-6,by-2,3,2,Wc);d.r(cx+4,by-2,3,2,Wc);
    if(f){d.l(cx+3,by-6,cx+7,by-15,B,2);d.p(cx+7,by-16,Wc);}else{d.l(cx-3,by-6,cx-7,by-15,B,2);d.p(cx-7,by-16,Wc);}return;}
  const c='#d8843a',w='#f2e8d8',dk='#a85a20';
  d.e(cx,by-8,7,8,c);d.e(cx+3,by-9,3,6,dk);d.e(cx,by-3,4,3,w);
  d.r(cx-6,by-2,3,2,c);d.r(cx+4,by-2,3,2,c);
  d.e(cx,by-19,5,4,c);d.tz(cx-4,by-27,by-22,0,2,c);d.tz(cx+4,by-27,by-22,0,2,c);d.p(cx-4,by-24,dk);d.p(cx+4,by-24,dk);
  d.r(cx-5,by-15,11,2,'#d82020');d.p(cx,by-13,'#f8d030');
  if(f)d.l(cx+2,by-3,cx+9,by-9,c,2);else d.l(cx-2,by-3,cx-9,by-9,c,2);
}

/* ---------- sprites ---------- */
// Hero, rear view: trucker cap with mesh back, grey hoodie, blue denim backpack with a tiger patch
const HERO=mk(56,62,d=>{const cx=28;
  d.e(cx,37,20,8,'#adadad');d.r(9,37,39,19,'#adadad');d.tz(cx,54,59,19,17,'#adadad');
  d.atop(()=>{d.r(40,30,10,30,'#8c8c8c');d.r(8,38,3,17,'#c8c8c8');});
  d.r(11,56,35,3,'#8a8a8a');for(let i=12;i<46;i+=2)d.p(i,57,'#707070');
  d.r(22,23,13,6,SKIN);d.r(22,23,2,6,SKIN_D);d.r(33,23,2,6,SKIN_D);
  d.e(cx,32,15,6,'#b8b8b8');d.e(cx,30,10,3,'#787878');d.e(cx+4,35,10,2,'#9a9a9a');
  d.r(12,31,5,10,'#1d3a7a');d.r(40,31,5,10,'#1d3a7a');
  d.r(15,37,27,19,'#2c4fa0');d.r(14,38,29,17,'#2c4fa0');
  d.dith(16,38,12,9,'#3a64bc');d.r(37,37,5,19,'#22408a');d.r(14,53,29,2,'#1a2f66');
  d.r(24,35,9,2,'#1a2f66');
  d.r(18,43,21,10,'#2a4a96');d.r(18,43,21,1,'#c8ccd8');d.r(36,43,2,3,'#e8e8e8');
  d.r(25,38,7,5,'#f08020');d.p(26,38,'#111');d.p(26,39,'#111');d.p(28,40,'#111');d.p(28,41,'#111');d.p(30,38,'#111');d.p(30,39,'#111');d.p(27,42,'#fff');d.p(29,42,'#fff');
  d.e(cx,18,10,7,'#7a5634');d.e(cx-3,20,4,2,'#8e6640');

function update(dt){
  t+=dt;
  if(state==='intro'){const prev=it;it+=dt;
    for(let i=0;i<4;i++)if(prev<8.4+i*.45&&it>=8.4+i*.45)sfx.ding();
    for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=260*dt;p.life-=dt;}parts=parts.filter(p=>p.life>0);
    if(it>INTRO_LEN){state='title';parts=[];}return;}
  if(state==='pause')return;
  const playing=state==='play';
  const diff=Math.min(1,dist/900);
  let target;
  const cNow=curv(trk+ZP);
  if(playing){target=(2.6+diff*2.4)*(K.u?1.4:K.d?.55:1);
    const dir=(K.r?1:0)-(K.l?1:0);px=clamp(px+dir*1.4*dt-cNow*speed*dt*.7,-.86,.86);}
  else if(state==='title'){target=2.4;px=Math.sin(t*.6)*.4;}
  else{target=.6;const p0=overT;overT+=dt;
    if(p0<1.2&&overT>=1.2)tone(300,.8,'triangle',.6,0,-200);
    if(p0<2&&overT>=2){splash(112,198,40,true);sfx.dive();}
    if(p0<2.6&&overT>=2.6){splash(150,198,30,true);noise(.3,.6);}}
  speed+=(target-speed)*Math.min(1,dt*2.2);
  const dz=speed*dt;if(playing)dist+=dz;
  trk+=dz;heading+=cNow*dz;genSegs(trk+80);computeX();
  camX+=(px*.35-camX)*Math.min(1,dt*6);
  if(inv>0)inv-=dt;if(shake>0)shake-=dt;
  if(banner)banner.t-=dt;

  if(state!=='over'){
    phase+=dt*(2.4+speed*.8);
    const a=Math.sin(phase)*.5,sx=heroX(),wy=heroY(),cy=wy-16;
    [-1,1].forEach((s,i)=>{const ey=cy+s*Math.sin(a)*58,ex=sx+s*Math.cos(a)*58,dip=ey>wy+2;
      if(dip&&!prevDip[i]){splash(ex,wy+4,9,false);if(playing)sfx.dip();}prevDip[i]=dip;});
    if(Math.random()<speed*dt*4)parts.push({x:sx+rnd(-30,30),y:wy+22,vx:rnd(-10,10),vy:rnd(5,20),life:.4,c:'#cfe8e4'});
    if(Math.random()<speed*dt*3){const s=Math.random()<.5?-1:1;parts.push({x:sx+s*8,y:wy-60,vx:s*rnd(15,30),vy:rnd(10,25),life:.5,c:'#e8f4f0'});}
  }

  for(const o of objs){
    if(o.type==='over'){if(o.warn>0){o.warn-=dt;continue;}o.z+=(o.rel+Math.max(0,3-speed)*.6)*dt;}
    else if(o.type==='fish'){o.z-=dz+1*dt;o.x=clamp(o.x+Math.sin(t*1.3+o.ph)*.18*dt,-.85,.85);}
    else if(o.type==='friend'){o.z-=dz-o.v*dt;o.x=clamp(o.x+Math.sin(t*.9+o.ph)*.05*dt,-.92,.92);}
    else if(o.type==='proj'){o.k+=dt/o.T;o.x=lerp(o.x0,o.x1,Math.min(1,o.k));o.z=lerp(o.z0,o.z1,Math.min(1,o.k));
      if(o.k>=1){o.dead=true;const p=proj(o.x1,o.z1);splash(p.x,p.y,6,false);objs.push({type:'can',img:CAN_FLOAT,x:o.x1,z:o.z1,hw:.07,dz:.15,ph:rnd(0,6)});}}
    else o.z-=dz;
    if(o.cast){o.cast.t-=dt;updCast(o);}
    if(o.shoutT>0)o.shoutT-=dt;
    if(playing&&(o.type==='fish'||(o.type==='bank'&&o.ph<2.6))&&o.z<9&&o.z>3.6&&o.throws<(o.type==='fish'?2:1)){o.thr-=dt;if(o.thr<=0){throwCan(o);o.throws++;o.thr=1.5;}}
    if(o.type==='pier'&&!o.dove&&o.z<6.5){o.dove=true;const b=box(o);splash(b.l+(o.side<0?88:15)*b.p.s,b.p.y,14,true);if(playing)sfx.dive();o.say='БУЛЬ!';}
    if(o.type==='dam'&&playing&&!o.warned&&o.z<16){o.warned=true;banner={text:'ВПЕРЕДИ ПЛОТИНА! ИЩИ ПРОХОД',t:2.5};sfx.warn();}
  }
  if(playing){
    for(const o of objs){
      if(o.type==='scen'||o.type==='rip'||o.type==='proj'||o.warn>0)continue;
      if(o.cast&&o.cast.ph==='set'){const f=fpos(o);
        if(Math.abs(f.z-ZP)<.2&&Math.abs(f.x-px)<PHW+.04){o.cast.ph='reel';o.cast.t=o.cast.T=.8;hit(null,'ЗАЦЕП!');if(state!=='play')break;}}
      if(o.type==='bank'||o.type==='fam'||o.hit)continue;
      if(o.sayIn&&!o.said&&o.z>o.sayIn[0]&&o.z<o.sayIn[1]){o.said=true;if(o.snd)sfx[o.snd]();}
      if(Math.abs(o.z-ZP)<(o.dz||.2)){

        else if(o.type==='dam'){col=Math.abs(px-o.g)>.22;msg='ПЛОТИНА!';}
        else{col=Math.abs(o.x-px)<o.hw+PHW;msg={friend:'ОЙ, ПРОСТИ!',rock:'БУМ!',can:'БАНКОЙ!'}[o.type]||'ПЛЮХ!';}

          else hit(o,msg);if(state!=='play')break;continue;}
      }

        if(passed){o.scored=true;const v={rock:10,fish:25,over:30,friend:15,can:10,pier:20,dam:60}[o.type]||10;bonus+=v;
          if(o.type==='dam'){sfx.hi();pop('ПРОШЁЛ ШЛЮЗ! +'+v,CX,96,'#a4e4fc');}
          else if(o.type!=='pier'&&Math.abs(o.x-px)<o.hw+PHW+.18){const extra=o.type==='friend'?25:20;bonus+=extra;
            if(o.type==='friend'){sfx.hi();pop('ПРИВЕТ! +'+(v+extra),proj(o.x,ZP).x,100,'#a4e4fc');}
            else{sfx.pass();pop('ЛОВКО! +'+(v+extra),proj(o.x,ZP).x,100);}}}

  }

  objs=objs.filter(o=>!o.dead&&(o.type==='proj'||(o.z>.55&&o.z<ZSPAWN+6)));

  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=260*dt;p.life-=dt;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=16*dt;p.life-=dt*.7;}
  pops=pops.filter(p=>p.life>0);
}

function drawProj(o){const p=proj(o.x,o.z),hgt=Math.sin(Math.PI*Math.min(1,o.k))*80*p.s;

  if(state!=='play'||o.hit||b.p.s<.22)return;
  if(o.shoutT>0)bubble(o.shout,b.p.x,b.tp);
  else if(o.sayIn&&o.z>o.sayIn[0]&&o.z<o.sayIn[1])bubble(o.says?o.says[Math.floor(t/1.1)%o.says.length]:o.say,o.type==='pier'?b.l+(o.side<0?88:15)*b.p.s:b.p.x,b.tp);
}
function drawFloat(o){
  const b=box(o),tip=rodTip(o,b),c=o.cast,f=fpos(o),fp=proj(f.x,f.z),k=1-Math.max(0,c.t)/c.T;
  let x=fp.x,y=fp.y;
  if(c.ph==='fly'){x=lerp(tip.x,fp.x,k);y=lerp(tip.y,fp.y,k)-Math.sin(k*Math.PI)*28*b.p.s;}
  else if(c.ph==='reel'){x=lerp(fp.x,tip.x,k);y=lerp(fp.y,tip.y,k);}
  else y+=Math.sin(t*6)*.8;
  const sag=c.ph==='fly'?0:6*b.p.s;ctx.fillStyle='rgba(235,235,235,.85)';
  for(let i=0;i<=16;i++){const q=i/16;ctx.fillRect(Math.round(lerp(tip.x,x,q)),Math.round(lerp(tip.y,y,q)+Math.sin(q*Math.PI)*sag),1,1);}
  const s=Math.max(1,Math.round(2*fp.s));
  ctx.fillStyle='#e82020';ctx.fillRect(Math.round(x)-s,Math.round(y)-s*2,s*2,s*2);
  ctx.fillStyle='#fcfcfc';ctx.fillRect(Math.round(x)-s,Math.round(y),s*2,s);
  if(c.ph==='set'&&fp.s>.4){ctx.fillStyle='rgba(220,240,240,.6)';const rw=Math.round((4+Math.sin(t*3)*2)*fp.s);ctx.fillRect(Math.round(x)-rw,Math.round(y)+s+1,rw*2,1);}
}
function drawPlayer(){
  const sx=Math.round(heroX()),wy=Math.round(heroY());
  ctx.globalAlpha=.4;ctx.drawImage(HERO_SHADOW,sx-36,wy-61);ctx.globalAlpha=1;
  ctx.drawImage(HERO_BOARD,sx-39,wy-66);
  ctx.fillStyle='#e8f4f0';for(let i=0;i<6;i++)ctx.fillRect(sx-38+Math.floor(Math.random()*4)+(i>2?70:0),wy+20+(i%3),2,1);
  if(state==='over'){const b=Math.round(Math.sin(t*3)*1.5);
    ctx.drawImage(HERO,14,0,28,26,sx+30,wy-16+b,28,26);
    ctx.fillStyle='#e8f4f0';ctx.fillRect(sx+28,wy+9+b,32,1);ctx.fillRect(sx+32,wy+11+b,24,1);return;}
  if(inv>0&&state==='play'&&Math.floor(inv*12)%2)return;
  const lean=state==='play'?(K.r?1:0)-(K.l?1:0):0;
  const a=Math.sin(phase)*.5+lean*.12,ca=Math.cos(a),sa=Math.sin(a);
  const cy=wy-16,bx=sx+lean,by=wy-56+Math.round(Math.sin(phase*2)*.7);
  const ex=s=>sx+s*ca*58,ey=s=>cy+s*sa*58;
  line(ex(-1),ey(-1),ex(1),ey(1),3,'#1e1e22');line(ex(-1),ey(-1)-1,ex(1),ey(1)-1,1,'#4a4a55');
  for(const s of[-1,1]){line(sx+s*ca*42,cy+s*sa*42,ex(s),ey(s),8,'#2a160a');line(sx+s*ca*43,cy+s*sa*43,ex(s)-s*ca,ey(s)-s*sa,6,'#e8601c');
    line(sx+s*ca*44,cy+s*sa*44-1,ex(s)-s*ca*2,ey(s)-s*sa*2-1,2,'#f8a060');}
  ctx.drawImage(HERO,bx-28,by);
  for(const s of[-1,1]){const hx=sx+s*ca*15,hy=cy+s*sa*15,shx=bx+s*19,shy=by+37;
    line(shx,shy,hx,hy,7,'#2a2622');line(shx,shy,hx,hy,5,'#b0b0b0');line(shx,shy+2,hx,hy+2,1,'#828282');
    ctx.fillStyle='#2a2622';ctx.fillRect(Math.round(hx)-3,Math.round(hy)-3,7,7);ctx.fillStyle=SKIN;ctx.fillRect(Math.round(hx)-2,Math.round(hy)-2,5,5);ctx.fillStyle=SKIN_D;ctx.fillRect(Math.round(hx)-2,Math.round(hy)+2,5,1);}
}
function drawHUD(){
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,16);
  txt('СЧЁТ '+String(score()).padStart(6,'0'),6,4);
  txt(meters()+' М',178,4,'#a4e4fc','center');
  for(let i=0;i<5;i++)ctx.drawImage(i<lives?HEART:HEART_E,W-72+i*13,2);
  const c=curv(trk+9);
  if(Math.abs(c)>.01&&state==='play'&&Math.floor(t*3)%2){const x=CX,y=22;ctx.fillStyle='#000';ctx.fillRect(x-31,y-1,62,14);ctx.fillStyle='#f8b800';ctx.fillRect(x-30,y,60,12);
    txt(c>0?'ПОВОРОТ >':'< ПОВОРОТ',x,y+2,'#000','center');}
}
function drawWarnings(){
  if(state!=='play')return;
  for(const o of objs){if(o.type!=='over'||!(o.warn>0))continue;
    if(Math.floor(o.warn*8)%2)continue;
    const x=Math.round(clamp(proj(o.x,ZP).x,12,W-12));
    ctx.fillStyle='#000';ctx.fillRect(x-8,218,16,16);ctx.fillStyle='#f8b800';ctx.fillRect(x-7,219,14,14);
    ctx.fillStyle='#000';ctx.fillRect(x-1,221,2,7);ctx.fillRect(x-1,230,2,2);
    ctx.fillStyle='#f8b800';ctx.fillRect(x-1,212,2,4);ctx.fillRect(x-3,213,6,1);
  }
}
let HAZE=null;
function render(){
  if(state==='intro'){drawIntro();return;}
  if(state==='over'){drawFall(overT);if(overT>=FALL_LEN)drawOver();return;}
  ctx.save();
  if(shake>0)ctx.translate(Math.round(rnd(-2,2)),Math.round(rnd(-2,2)));
  drawSky();drawRiver();
  const list=objs.filter(o=>!(o.warn>0)&&o.z<24).map(o=>({z:o.z,f:()=>drawObj(o)}));
  for(const o of objs)if(o.cast&&o.cast.ph!=='idle'&&o.cast.ph!=='wind'){const z=Math.max(.6,fpos(o).z);list.push({z:Math.min(z,o.z-.01),f:()=>drawFloat(o)});}
  list.sort((a,b)=>b.z-a.z);
  if(!HAZE){HAZE=ctx.createLinearGradient(0,HY-80,0,HY+14);HAZE.addColorStop(0,'rgba(200,225,230,0)');HAZE.addColorStop(.75,'rgba(200,225,230,.32)');HAZE.addColorStop(1,'rgba(200,225,230,0)');}
  let drawn=false,hazed=false;
  for(const e of list){
    if(!hazed&&e.z<9){ctx.fillStyle=HAZE;ctx.fillRect(0,HY-80,W,94);hazed=true;}
    if(!drawn&&e.z<ZP){drawPlayer();drawn=true;}e.f();}
  if(!drawn)drawPlayer();
  for(const p of parts){ctx.fillStyle=p.c;const s=p.life>.4?2:1;ctx.fillRect(Math.round(p.x),Math.round(p.y),s,s);}
  drawWarnings();
  for(const p of pops)txt(p.text,Math.round(p.x),Math.round(p.y),p.c,'center');
  ctx.restore();
  drawHUD();
  if(banner&&banner.t>0&&Math.floor(t*4)%2)txt(banner.text,CX,60,'#f8b800','center');
  if(state==='title')drawTitle();
  if(state==='pause'){panel(84,72);txt('ПАУЗА',CX,98,'#f8b800','center',16);txt('P - ПРОДОЛЖИТЬ',CX,126,'#fcfcfc','center');}
  if(state==='over')drawOver();
}
function panel(y,h){ctx.fillStyle='rgba(0,0,0,.72)';ctx.fillRect(24,y,W-48,h);ctx.fillStyle='#f8b800';ctx.fillRect(24,y,W-48,1);ctx.fillRect(24,y+h-1,W-48,1);}
function drawTitle(){
  panel(22,108);
  txt('САП-ТИГР',CX+2,32,'#e45c10','center',16);txt('САП-ТИГР',CX,30,'#f8b800','center',16);
  txt('РЕЧНОЙ ЗАПЛЫВ',CX,54,'#fcfcfc','center');
  txt('СТРЕЛКИ - РУЛИТЬ, ВВЕРХ - ГРЕСТИ',CX,70,'#a4e4fc','center');
  txt('КАМНИ, ЛЕСКИ, БАНКИ, ПЛОТИНЫ',CX,84,'#f87858','center');
  txt('ДРУЗЕЙ ОБХОДИ ВПРИТИРКУ',CX,98,'#a4e4fc','center');
  txt('РЕКОРД '+String(best).padStart(6,'0'),CX,114,'#fcfcfc','center');
  if(Math.floor(t*2)%2)txt('ЖМИ ENTER ИЛИ ТАП',CX,226,'#f8b800','center');
}
function drawOver(){
  panel(62,84);
  txt('ЗАПЛЫВ ОКОНЧЕН',CX,74,'#f8b800','center');
  txt('СЧЁТ   '+String(score()).padStart(6,'0'),CX,92,'#fcfcfc','center');
  txt('РЕКОРД '+String(best).padStart(6,'0'),CX,106,score()>=best&&best>0?'#f8b800':'#a4e4fc','center');
  if(overT>FALL_LEN+.5&&Math.floor(t*2)%2)txt('ENTER - ЕЩЁ РАЗ',CX,126,'#a4e4fc','center');
}

/* ---------- input ---------- */
function press(){
  initAudio();
  if(state==='intro'){state='title';parts=[];}
  else if(state==='title')startGame();
  else if(state==='over'){if(overT<FALL_LEN)overT=FALL_LEN;else if(overT>FALL_LEN+.5)startGame();}
  else if(state==='pause')state='play';
}
const KEYMAP={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',ArrowUp:'u',KeyW:'u',ArrowDown:'d',KeyS:'d'};
addEventListener('keydown',e=>{
  if(KEYMAP[e.code]){K[KEYMAP[e.code]]=1;e.preventDefault();}
  if(e.code==='Enter'||e.code==='Space'){e.preventDefault();if(!e.repeat)press();}
  if(e.code==='KeyP'&&!e.repeat){if(state==='play')state='pause';else if(state==='pause')state='play';}
  if(e.code==='KeyM'&&!e.repeat)toggleMute();
});
addEventListener('keyup',e=>{if(KEYMAP[e.code])K[KEYMAP[e.code]]=0;});
addEventListener('blur',()=>{K.l=K.r=K.u=K.d=0;if(state==='play')state='pause';});
cv.addEventListener('pointerdown',()=>press());
document.querySelectorAll('.pad button').forEach(b=>{
  const k=b.dataset.k;
  const on=e=>{e.preventDefault();initAudio();b.classList.add('on');if(k==='start')press();else K[k]=1;};
  const off=()=>{b.classList.remove('on');if(k!=='start')K[k]=0;};
  b.addEventListener('pointerdown',on);['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,off));
  b.addEventListener('contextmenu',e=>e.preventDefault());
});
const muteBtn=document.getElementById('mute');
function toggleMute(){muted=!muted;muteBtn.textContent='ЗВУК: '+(muted?'ВЫКЛ':'ВКЛ');}
muteBtn.addEventListener('click',()=>{initAudio();toggleMute();muteBtn.blur();});

/* ---------- loop ---------- */
resetWorld();
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);
})();
</script>
</body>
