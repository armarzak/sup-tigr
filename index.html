<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Сап-Тигр</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
/* Layout: one 16-bit console screen in a plastic bezel, cartridge-label header above, controls below. Deliberately single dark theme. */
:root{
  --bg:#121417; --bezel:#26292e; --bezel-hi:#3a3f47; --ink:#ece6d6; --muted:#8f8a7e;
  --accent:#f8b800; --accent-2:#e45c10; --btn:#c81c1c; --btn-b:#1848b8; --btn-ink:#fff4e0;
  --pix:"Press Start 2P", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--pix)}
.wrap{max-width:1000px;margin:0 auto;padding-inline:16px;padding-block:14px 24px;display:flex;flex-direction:column;gap:12px;align-items:center}
header{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:16px;color:var(--accent);margin:0;letter-spacing:1px;text-shadow:2px 2px 0 var(--accent-2)}
.tag{font-size:8px;color:var(--muted);letter-spacing:1px}
.mute{font-family:var(--pix);font-size:8px;background:var(--bezel);color:var(--ink);border:2px solid var(--bezel-hi);padding:6px 8px;cursor:pointer}
.mute:focus-visible,.pad button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tv{background:var(--bezel);padding:10px;border-radius:6px;box-shadow:inset 0 0 0 2px var(--bezel-hi),0 8px 0 #0a0b0d;width:min(100%,980px,calc((100dvh - 210px)*1.3333 + 20px));min-width:min(100%,300px)}
canvas{display:block;width:100%;aspect-ratio:320/240;image-rendering:pixelated;image-rendering:crisp-edges;background:#000;touch-action:none}
.help{font-size:8px;line-height:2.2;color:var(--muted);display:flex;gap:4px 22px;flex-wrap:wrap;justify-content:center;text-align:center}
.help b{color:var(--ink);font-weight:400}
.pad{display:none;width:100%;max-width:560px;justify-content:space-between;align-items:center;gap:10px;user-select:none;-webkit-user-select:none}
.pad button{font-family:var(--pix);touch-action:none;-webkit-tap-highlight-color:transparent;cursor:pointer}
.dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,44px);gap:4px}
.dpad button{background:#2e3238;color:var(--ink);border:2px solid #4a4f58;border-radius:6px;font-size:16px}
.dpad [data-k="u"]{grid-column:2;grid-row:1}.dpad [data-k="l"]{grid-column:1;grid-row:2}.dpad [data-k="r"]{grid-column:3;grid-row:2}.dpad [data-k="d"]{grid-column:2;grid-row:3}
.mid{display:flex;flex-direction:column;gap:8px}
.mid button{background:#3a3f47;color:var(--ink);border:0;border-radius:10px;padding:8px 12px;font-size:8px}
.ab{display:grid;grid-template-columns:repeat(2,58px);gap:8px}
.ab .c{background:#d87a10;border-color:#7a4008}.ab .d{background:#3a8a2a;border-color:#1a4a12}
.ab button{width:56px;height:56px;border-radius:50%;background:var(--btn);color:var(--btn-ink);border:2px solid #7a0e0e;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.ab .b{background:var(--btn-b);border-color:#0c2a70}
.ab button span{font-size:6px}

.pad button.on{filter:brightness(1.35)}
@media (hover:none) and (pointer:coarse){.pad{display:flex}.help{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>САП-ТИГР</h1>
    <span class="tag">РЕЧНОЙ ХАОС · 1 ИГРОК</span>
    <button class="mute" id="mute" type="button">ЗВУК: ВКЛ</button>
  </header>
  <div class="tv"><canvas id="scr" width="320" height="240" aria-label="Игровой экран"></canvas></div>
  <div class="help">
    <span><b>← →</b> поворот</span>
    <span><b>↑</b> грести сильнее</span>
    <span><b>↓</b> тормоз</span>
    <span><b>SHIFT / Z</b> встать / сесть</span>
    <span><b>ПРОБЕЛ / X</b> прыжок (стоя)</span>
    <span><b>C</b> бросок (держать — водяное ружьё)</span>
    <span><b>Q</b> сменить вещь</span>
    <span><b>V</b> удар веслом</span>
    <span><b>ENTER</b> старт</span>
    <span><b>P</b> пауза</span>
    <span><b>M</b> звук</span>
  </div>
  <div class="pad" id="pad">
    <div class="dpad"><button data-k="u" aria-label="Грести">▲</button><button data-k="l" aria-label="Влево">◀</button><button data-k="r" aria-label="Вправо">▶</button><button data-k="d" aria-label="Тормоз">▼</button></div>
    <div class="mid"><button data-k="start">СТАРТ</button><button data-k="item">ВЕЩЬ</button></div>
    <div class="ab"><button data-k="hit" class="d" aria-label="Удар веслом">D<span>ВЕСЛО</span></button><button data-k="throw" class="c" aria-label="Бросок">C<span>БРОСОК</span></button><button data-k="mode" class="b" aria-label="Встать или сесть">B<span>ВСТАТЬ</span></button><button data-k="jump" class="a" aria-label="Прыжок">A<span>ПРЫЖОК</span></button></div>
  </div>
</div>

<script>
(()=>{
const cv=document.getElementById('scr'), ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;
const W=320,H=240,CX=160,HY=84;
const FONT='"Press Start 2P", monospace';
const SKIN='#f0b898',SKIN_D='#c98a70';
/* ---------- pixel toolkit ---------- */
function tk(x,w,h){const d={
  r:(a,b,ww,hh,c)=>{x.fillStyle=c;x.fillRect(Math.round(a),Math.round(b),Math.round(ww),Math.round(hh));},
  p:(a,b,c)=>{x.fillStyle=c;x.fillRect(Math.round(a),Math.round(b),1,1);},
  e:(cx,cy,rx,ry,c)=>{cx=Math.round(cx);cy=Math.round(cy);rx=Math.max(0,Math.round(rx));ry=Math.max(0,Math.round(ry));x.fillStyle=c;
    for(let j=-ry;j<=ry;j++){const hw=Math.round(rx*Math.sqrt(Math.max(0,1-(j*j)/((ry+.5)*(ry+.5)))));x.fillRect(cx-hw,cy+j,hw*2+1,1);}},
  tz:(cx,y0,y1,h0,h1,c)=>{x.fillStyle=c;for(let y=Math.round(y0);y<=y1;y++){const f=(y-y0)/Math.max(1,y1-y0);const hw=Math.round(h0+(h1-h0)*f);x.fillRect(Math.round(cx)-hw,y,hw*2+1,1);}},
  l:(x0,y0,x1,y1,c,th=1)=>{x.fillStyle=c;const dx=x1-x0,dy=y1-y0,n=Math.max(1,Math.ceil(Math.max(Math.abs(dx),Math.abs(dy)))),o=Math.floor(th/2);
    for(let i=0;i<=n;i++)x.fillRect(Math.round(x0+dx*i/n)-o,Math.round(y0+dy*i/n)-o,th,th);},
  dith:(a,b,ww,hh,c)=>{x.fillStyle=c;for(let j=0;j<hh;j++)for(let i=0;i<ww;i++)if(((a+i)+(b+j))%2===0)x.fillRect(a+i,b+j,1,1);},
  clear:(a,b,ww,hh)=>x.clearRect(a,b,ww,hh),
  atop:fn=>{x.globalCompositeOperation='source-atop';fn();x.globalCompositeOperation='source-over';},
  layer:fn=>{const c2=document.createElement('canvas');c2.width=w;c2.height=h;fn(tk(c2.getContext('2d'),w,h));x.drawImage(c2,0,0);}
};return d;}
function outline(c){const x=c.getContext('2d'),w=c.width,h=c.height,id=x.getImageData(0,0,w,h),s=id.data,o=new Uint8ClampedArray(s);
  const A=(i,j)=>i>=0&&j>=0&&i<w&&j<h&&s[(j*w+i)*4+3]>128;
  for(let j=0;j<h;j++)for(let i=0;i<w;i++){if(A(i,j))continue;if(A(i-1,j)||A(i+1,j)||A(i,j-1)||A(i,j+1)){const k=(j*w+i)*4;o[k]=24;o[k+1]=20;o[k+2]=18;o[k+3]=255;}}
  id.data.set(o);x.putImageData(id,0,0);}
function mk(w,h,draw,after,noOutline){const c=document.createElement('canvas');c.width=w;c.height=h;const d=tk(c.getContext('2d'),w,h);
  draw(d);if(!noOutline)outline(c);if(after)after(d);c.wl=h;return c;}
function flip(c){const n=document.createElement('canvas');n.width=c.width;n.height=c.height;const x=n.getContext('2d');x.translate(c.width,0);x.scale(-1,1);x.drawImage(c,0,0);n.wl=c.wl;return n;}
let seed=11;const srnd=()=>((seed=(seed*16807)%2147483647)/2147483647);
const SKY=(()=>{const c=document.createElement('canvas');c.width=W;c.height=HY;const x=c.getContext('2d');
  const cols=['#3f78c0','#4f8ccc','#64a2d6','#7cb6de','#98c8e4','#b4d8e8','#cfe6ea'];const bh=(HY-16)/cols.length;
  cols.forEach((col,i)=>{x.fillStyle=col;x.fillRect(0,16+Math.floor(i*bh),W,Math.ceil(bh)+1);
    if(i>0){x.fillStyle=cols[i-1];const y0=16+Math.floor(i*bh);for(let j=0;j<2;j++)for(let k=(j%2);k<W;k+=2)x.fillRect(k,y0+j,1,1);}});
  const d=tk(x,W,HY);d.e(262,30,13,13,'#f8f0c8');d.e(262,30,10,10,'#fcf8e0');
  return c;})();
const FPAN=640,FH=80;
const FOREST=(()=>{const c=document.createElement('canvas');c.width=FPAN;c.height=FH;const x=c.getContext('2d');const d=tk(x,FPAN,FH);
  const layer=(n,hmin,hmax,col,hi)=>{for(let i=0;i<n;i++){const cx=Math.floor(srnd()*FPAN),h=hmin+Math.floor(srnd()*(hmax-hmin)),sp=srnd()<.6;
    for(const o of[-FPAN,0,FPAN]){if(sp){d.tz(cx+o,FH-h,FH,0,Math.round(h*.22),col);if(hi)d.l(cx+o,FH-h+3,cx+o-Math.round(h*.16),FH-h*.4,hi);}
      else{d.e(cx+o,FH-h+9,8+Math.floor(h/7),9,col);d.r(cx+o-7,FH-h+9,15,h,col);if(hi)d.r(cx+o-6,FH-h+3,4,1,hi);}}}};
  layer(90,48,78,'#5d8a80',null);layer(120,32,62,'#3a6650','#4a7a5a');layer(110,18,42,'#22492e','#2f5c38');
  return c;})();
function makeCloud(w){return mk(w,18,d=>{for(let i=0;i<w/8;i++)d.e(8+i*7,10-(i%2)*3,5+(i%2),5+(i%2),'#f4f8fa');d.r(4,14,w-8,3,'#c8dce6');},null,true);}
const CLOUDS=[makeCloud(56),makeCloud(40),makeCloud(72)];

/* ---------- helpers ---------- */
const rnd=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,f)=>a+(b-a)*f;
function hsh(x,y){let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263))|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296;}
const RGB=new Map();function rgb(c){let q=RGB.get(c);if(!q){q=[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];RGB.set(c,q);}return q;}
// draw a top-down shape at any angle pixel by pixel, so rotation stays crisp
function rotSprite(Rr,ang,shader,noOut){const S=Rr*2+3,c=document.createElement('canvas');c.width=S;c.height=S;const x=c.getContext('2d'),id=x.createImageData(S,S),D=id.data,co=Math.cos(ang),si=Math.sin(ang),m=Rr+1;
  for(let j=0;j<S;j++)for(let i=0;i<S;i++){const px=i-m,py=j-m,u=px*co+py*si,v=-px*si+py*co,col=shader(u,v,px,py);if(!col)continue;const q=rgb(col),k=(j*S+i)*4;D[k]=q[0];D[k+1]=q[1];D[k+2]=q[2];D[k+3]=255;}
  x.putImageData(id,0,0);if(!noOut)outline(c);c.m=m;return c;}
function tint(c,col){const n=document.createElement('canvas');n.width=c.width;n.height=c.height;const x=n.getContext('2d');x.drawImage(c,0,0);x.globalCompositeOperation='source-in';x.fillStyle=col;x.fillRect(0,0,n.width,n.height);n.m=c.m;return n;}
const NA=32,angIdx=a=>((Math.round(a/(2*Math.PI)*NA)%NA)+NA)%NA;

/* ---------- boards, seen from above ---------- */
function boardShader(b){return(u,v,px,py)=>{const L=b.L,f=u/L;if(f>1||f<-1)return null;
  const w=b.W*(f>0?Math.sqrt(1-f*f):Math.sqrt(Math.max(0,1-Math.pow(-f,8))));const av=Math.abs(v);if(av>w)return null;
  if(av>w-1.6||Math.abs(u)>L-1.4)return(px*.7+py)>0?b.railD:b.rail;
  if(f>.45&&f<.62&&av<1)return'#222222';
  if(f<.14&&f>-.8&&av<w-2.6){if(b.tex&&((((u|0)+(v|0))&3)===0||(((u|0)-(v|0))&3)===0))return b.tex;return b.pad;}
  return b.deck;};}
const BC=new Map();
function boardImg(b,a){const ai=angIdx(a),key=b.id+'/'+ai;let e=BC.get(key);
  if(!e){const img=rotSprite(Math.ceil(b.L)+1,ai*2*Math.PI/NA,boardShader(b));e={img,sh:tint(img,'#0c2a1a')};BC.set(key,e);}return e;}
const BD={
  hero:{id:'hero',L:24,W:7.5,rail:'#e8601c',railD:'#a8400c',deck:'#f8c020',pad:'#ecac18',tex:'#d08a10'},
  teal:{id:'teal',L:22,W:7,rail:'#1aa0b0',railD:'#0a6070',deck:'#e8eef0',pad:'#a8b8bc'},
  blue:{id:'blue',L:22,W:7,rail:'#2a62d8',railD:'#14347a',deck:'#f0f0f0',pad:'#3a3a3a'},
  pink:{id:'pink',L:22,W:7,rail:'#e83a8a',railD:'#902050',deck:'#fce8f0',pad:'#c8a0b0'},
  green:{id:'green',L:22,W:7,rail:'#3aa83a',railD:'#1a601a',deck:'#f0f8e0',pad:'#90b070'},
  sky:{id:'sky',L:22,W:7,rail:'#f0f0f0',railD:'#909090',deck:'#3cbcfc',pad:'#2080b8'},
  black:{id:'black',L:22,W:7,rail:'#f8d030',railD:'#a88010',deck:'#303030',pad:'#505050'},
  big:{id:'big',L:25,W:9,rail:'#2a62d8',railD:'#14347a',deck:'#f0f0f0',pad:'#c8c8c8'},
  kid:{id:'kid',L:15,W:5.2,rail:'#3aa83a',railD:'#1a601a',deck:'#f8f040',pad:'#d0c020'}};
const BOAT={id:'boat',shader:(u,v,px,py)=>{const f=u/24;if(Math.abs(f)>1)return null;const w=11*Math.sqrt(1-Math.pow(Math.abs(f),f>0?2:4));const av=Math.abs(v);if(av>w)return null;
  if(av>w-1.8)return(px*.7+py)>0?'#4e565c':'#8a9298';if(Math.abs(u-7)<1.6||Math.abs(u+8)<1.6)return'#a07040';return(((u|0)&3)===0)?'#98a0a6':'#b0b8be';}};
const BOATC=new Map();
function boatImg(a){const ai=angIdx(a);let e=BOATC.get(ai);if(!e){const img=rotSprite(26,ai*2*Math.PI/NA,BOAT.shader);e={img,sh:tint(img,'#0c2a1a')};BOATC.set(ai,e);}return e;}
const LOGC=new Map();
function logImg(a){const ai=angIdx(a)%16;let e=LOGC.get(ai);if(!e){const img=rotSprite(27,ai*2*Math.PI/NA,(u,v)=>{if(Math.abs(u)>26||Math.abs(v)>5)return null;
  if(Math.abs(u)>23.5)return Math.abs(v)<1.5?'#7a4a24':'#d8a868';if(Math.abs(v)>3.5)return'#4e2c12';return(((u|0)+((v+9)|0)*3)%7===0)?'#5a3418':'#8a5428';});e={img,sh:tint(img,'#0c2a1a')};LOGC.set(ai,e);}return e;}

/* ---------- people: big-headed cartoon soldiers style, 4 facings ---------- */
const PC=new Map();
function personSprite(o,facing,sit,fr){const key=o.id+'|'+facing+'|'+(sit?1:0)+'|'+(fr|0);let c=PC.get(key);
  if(!c){const fl=facing==='w';c=mk(30,38,d=>drawPerson(d,o,fl?'e':facing,sit,fr|0));if(fl)c=flip(c);PC.set(key,c);}return c;}
const dk=(c,f)=>{const q=rgb(c);return'#'+q.map(v=>Math.max(0,Math.min(255,Math.round(v*f))).toString(16).padStart(2,'0')).join('');};
function drawPerson(d,o,F,sit,fr){
  const k=o.k||1,R=v=>Math.round(v*k),wd=o.wide||1,cx=15,fy=36,skin=o.skin||SKIN,skinD=dk(skin,.82),hair=o.hair||'#5a3a1a';
  const hipY=sit?fy-R(3):fy-R(9),sh=o.shorts,shD=dk(sh,.72);
  if(sit){if(F==='e'){d.r(cx-R(2),hipY-R(2),R(10),R(3),sh);d.r(cx-R(2),hipY,R(10),1,shD);d.r(cx+R(8),hipY-R(2),R(2),R(3),skin);}
    else{d.r(cx-R(8),hipY-R(2),R(16)+1,R(3),sh);d.r(cx-R(8),hipY,R(16)+1,1,shD);d.r(cx-R(9),hipY-R(1),R(2),R(2),skin);d.r(cx+R(8),hipY-R(1),R(2),R(2),skin);}}
  else{const lc=o.legs||skin,lcD=dk(lc,.8),foot=(x,w)=>{if(o.barefoot){d.r(x,fy-R(2),w,R(2),skin);d.p(x+w-1,fy-1,skinD);}else{d.r(x,fy-R(2),w,R(2),'#3a2a1a');d.r(x,fy-R(2),w,1,'#6a5a4a');}};
    if(F==='e'){d.r(cx-R(3),hipY,R(3),R(7),lcD);d.r(cx+R(1),hipY,R(3),R(7),lc);d.p(cx+R(1),hipY+R(3),lcD);foot(cx-R(3),R(4));foot(cx+R(1),R(5));}
    else{d.r(cx-R(4),hipY,R(3),R(7),lc);d.r(cx+R(1),hipY,R(3),R(7),lc);d.r(cx-R(2),hipY,1,R(7),lcD);d.r(cx+R(3),hipY,1,R(7),lcD);
      d.p(cx-R(3),hipY+R(3),lcD);d.p(cx+R(2),hipY+R(3),lcD);foot(cx-R(5),R(4));foot(cx+R(1),R(4));}
    const shH=o.longShorts?R(8):R(4);d.r(cx-R(5*wd),hipY-R(3),R(10*wd)+1,shH,sh);d.r(cx-R(5*wd),hipY-R(3),R(10*wd)+1,1,shD);
    if(F!=='e')d.r(cx,hipY-R(1),1,shH-R(2),shD);d.r(cx+R(3*wd),hipY-R(2),R(2*wd),shH-1,dk(sh,.85));
    if(o.longShorts)d.r(cx-R(5*wd),hipY-R(3)+shH-1,R(10*wd)+1,1,shD);
    if(o.palms){const palm=(x,y)=>{d.r(x,y,1,3,'#7a4a1a');d.r(x-1,y-1,3,1,'#3ab84a');d.p(x-2,y,'#2a8a2a');d.p(x+2,y,'#2a8a2a');d.p(x+1,y+1,'#f8d030');};
      palm(cx-R(3*wd),hipY-R(1));palm(cx+R(2*wd),hipY+R(1));palm(cx-R(1),hipY+R(3));}
    if(o.hawaii){const fl=(x,y,c)=>{d.p(x,y,'#f8f040');d.p(x-1,y,c);d.p(x+1,y,c);d.p(x,y-1,c);d.p(x,y+1,c);};
      fl(cx-R(3*wd),hipY-R(1),'#fcfcfc');fl(cx+R(2*wd),hipY-R(2),'#e83a8a');d.p(cx-R(5*wd)+1,hipY,'#2a8a2a');d.p(cx+R(4*wd),hipY,'#2a8a2a');d.p(cx,hipY-R(2),'#2a8a2a');}}
  const tT=hipY-R(11),bare=o.shirt===SKIN||o.bikini;
  const tor=bare?skin:o.shirt,torD=bare?skinD:o.shirtD,torL=bare?dk(skin,1.08):(o.shirtL||dk(o.shirt,1.15));
  d.r(cx-R(6*wd),tT,R(12*wd)+1,R(9),tor);d.e(cx,tT+R(1),R(6*wd),R(2),tor);
  if(wd>1)d.e(cx+(F==='e'?R(2):0),tT+R(6),R(5*wd),R(3),tor);

  const key=Math.floor(gx/GCELL)+','+Math.floor(gy/GCELL);let a=GRID.get(key);if(!a)GRID.set(key,a=[]);a.push(i);}
function nextSeg(){
  if(!lastTurn){lastTurn=true;const north=Math.abs(ga+Math.PI/2)<.35;
    const target=north?-Math.PI/2+(Math.random()<.5?-1:1)*rnd(75,90)*Math.PI/180:-Math.PI/2+rnd(-.2,.2);
    const dA=target-ga,R=rnd(170,240),n=Math.max(8,Math.round(R*Math.abs(dA)/STEP));return{n,da:dA/n,wig:false};}
  lastTurn=false;return{n:Math.round(rnd(60,130)),da:0,wig:true};}
function stepPath(){if(cur.n<=0)cur=nextSeg();ga+=cur.da+(cur.wig?Math.sin(PX.length*.045)*.005:0);ga=clamp(ga,-Math.PI,0);
  gx+=Math.cos(ga)*STEP;gy+=Math.sin(ga)*STEP;addSample();cur.n--;}
function genToY(y){while(gy>y)stepPath();}
function genToI(n){while(PX.length<n)stepPath();}
function samplesNear(x0,y0,x1,y1,every){const out=[];for(let cy=Math.floor(y0/GCELL);cy<=Math.floor(y1/GCELL);cy++)for(let cx=Math.floor(x0/GCELL);cx<=Math.floor(x1/GCELL);cx++){
  const a=GRID.get(cx+','+cy);if(a)for(const i of a)if(i%every===0)out.push(i);}return out;}
function nearestT(x,y){const c=samplesNear(x-170,y-170,x+170,y+170,1);let b=1e12,bi=-1;for(const i of c){const dx=PX[i]-x,dy=PY[i]-y,d2=dx*dx+dy*dy;if(d2<b){b=d2;bi=i;}}return bi<0?999:Math.sqrt(b)-HWa[bi];}
function at(i){i=clamp(i,0,PX.length-1.001);const k=Math.floor(i),f=i-k;return{x:lerp(PX[k],PX[k+1],f),y:lerp(PY[k],PY[k+1],f),a:PA[k],hw:HWa[k]};}

const CH=128;let chunks=new Map(),treeCache=new Map();
function groundCol(t,wx,wy){const n=hsh(wx,wy);
  if(t<-16){if(hsh(wx>>2,wy)<.012)return'#9cc8a4';return(Math.floor(-t/11)&1)?'#346e50':'#397455';}
  if(t<-7)return n<.5?'#43825f':'#498865';
  if(t<-2)return n<.55?'#78a886':'#4a8464';
  if(t<0)return'#d6e8d4';
  if(t<6)return n<.3?'#8a6a3a':n<.65?'#a8865a':'#b8945a';
  if(t<10)return n<.5?'#3c7a2c':'#2f6a26';
  const g=hsh(wx>>1,wy>>1);if(g<.07)return'#2e6e2a';if(g>.95)return'#78c45a';return n<.5?'#4aa040':'#459a3c';}
function treesOf(cx,cy){const key=cx+','+cy;let L=treeCache.get(key);if(L)return L;L=[];
  let s=(Math.imul(cx,73856093)^Math.imul(cy,19349663))>>>0||1;const r=()=>((s=(Math.imul(s,1103515245)+12345)>>>0)/4294967296);
  for(let n=0;n<34;n++){const x=cx*CH+r()*CH,y=cy*CH+r()*CH,t=nearestT(x,y),q=r();
    if(t>22)L.push({x,y,img:TREES[Math.floor(q*TREES.length)],sh:1});
    else if(t>9&&q<.7)L.push({x,y,img:BUSHES[Math.floor(q*3)%3],sh:.6});}
  for(let n=0;n<14;n++){const x=cx*CH+r()*CH,y=cy*CH+r()*CH,t=nearestT(x,y);if(t>-3&&t<7)L.push({x,y,img:REEDS[n%3],sh:0});}
  treeCache.set(key,L);return L;}
function buildChunk(cx,cy){
  const x0=cx*CH,y0=cy*CH,c=document.createElement('canvas');c.width=CH;c.height=CH;const x=c.getContext('2d'),id=x.createImageData(CH,CH),D=id.data;
  const cand=samplesNear(x0-180,y0-180,x0+CH+180,y0+CH+180,2);
  for(let j=0;j<CH;j++)for(let i=0;i<CH;i++){const wx=x0+i,wy=y0+j;let b=1e12,bi=-1;
    for(let q=0;q<cand.length;q++){const k=cand[q],dx=PX[k]-wx,dy=PY[k]-wy,d2=dx*dx+dy*dy;if(d2<b){b=d2;bi=k;}}
    const t=bi<0?999:Math.sqrt(b)-HWa[bi],col=rgb(groundCol(t,wx,wy)),o=(j*CH+i)*4;D[o]=col[0];D[o+1]=col[1];D[o+2]=col[2];D[o+3]=255;}
  x.putImageData(id,0,0);
  const L=[];for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)L.push(...treesOf(cx+dx,cy+dy));
  L.sort((a,b)=>a.y-b.y);
  x.fillStyle='rgba(10,40,10,.38)';
  for(const tr of L)if(tr.sh){const rx=Math.round(tr.img.width*.42*tr.sh),ex=Math.round(tr.x-x0+3),ey=Math.round(tr.y-y0);
    for(let k=-3;k<=3;k++){const w=Math.round(rx*Math.sqrt(1-(k*k)/12.25));x.fillRect(ex-w,ey+k,w*2,1);}}
  for(const tr of L){const ix=Math.round(tr.x-x0-tr.img.width/2),iy=Math.round(tr.y-y0-tr.img.height+2);
    if(ix>CH||iy>CH||ix+tr.img.width<0||iy+tr.img.height<0)continue;x.drawImage(tr.img,ix,iy);}
  return c;}
function chunkAt(cx,cy,force){const k=cx+','+cy;let c=chunks.get(k);if(!c&&force){genToY(cy*CH-520);c=buildChunk(cx,cy);chunks.set(k,c);}return c;}

  try{ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=.1;master.connect(ac.destination);
    noiseBuf=ac.createBuffer(1,ac.sampleRate*.5,ac.sampleRate);const dd=noiseBuf.getChannelData(0);for(let i=0;i<dd.length;i++)dd[i]=Math.random()*2-1;

}
function tone(f,dur,type='square',vol=1,when=0,slide=0){

  g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.001,t0+dur);
  o.connect(g);g.connect(master);o.start(t0);o.stop(t0+dur+.02);

function noise(dur,vol){if(!ac||muted)return;const s=ac.createBufferSource(),g=ac.createGain();s.buffer=noiseBuf;
  g.gain.setValueAtTime(vol,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);s.connect(g);g.connect(master);s.start();s.stop(ac.currentTime+dur);}

        if(!o.scored&&P.i>o.i+8){o.scored=1;if(Math.abs(o.d-latOf())<50){bonus+=25;sfx.hi();pop('ПРИВЕТ! +25',q.x,q.y-40,'#a4e4fc');}}break;}

      case'dam':{const l=toLocal(P.x,P.y,o.x,o.y,o.a);if(Math.abs(l.u)<10&&Math.abs(l.v-o.g)>o.gw-9){const sg=l.u<0?-1:1;P.x+=Math.cos(o.a)*sg*12;P.y+=Math.sin(o.a)*sg*12;P.v=0;hit('ПЛОТИНА!');}

          if(Math.abs(o.d-latOf())<48){bonus+=25;if(o.role==='friend'){sfx.hi();pop('ПРИВЕТ! +'+(v+25),q.x,q.y-40,'#a4e4fc');}else{sfx.pass();pop('ЛОВКО! +'+(v+25),q.x,q.y-40);}}}

    }

function update(dt){
  t+=dt;
  if(state==='intro'){const prev=it;it+=dt;for(let i=0;i<4;i++)if(prev<8.4+i*.45&&it>=8.4+i*.45)sfx.ding();
    for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=260*dt;p.life-=dt;}parts=parts.filter(p=>p.life>0);
    if(it>INTRO_LEN){state='title';parts=[];}return;}
  if(state==='pause')return;
  if(state==='over'){const p0=overT;overT+=dt;
    if(p0<1.2&&overT>=1.2)tone(300,.8,'triangle',.6,0,-200);
    if(p0<2&&overT>=2){splash(112,198,40,true);sfx.dive();}
    if(p0<2.6&&overT>=2.6){splash(150,198,30,true);noise(.3,.6);}
    for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=260*dt;p.life-=dt;}parts=parts.filter(p=>p.life>0);return;}
  const playing=state==='play';
  genToI(P.i+520);
  updatePlayer(dt,!playing);
  const tx=P.x+Math.cos(P.a)*45-CX,ty=P.y+Math.sin(P.a)*45-135;
  camX+=(tx-camX)*Math.min(1,dt*3.5);camY+=(ty-camY)*Math.min(1,dt*3.5);
  if(inv>0)inv-=dt;if(shake>0)shake-=dt;if(banner)banner.t-=dt;
  if(playing){const diff=clamp((P.maxI-250)/2600,0,1);
    while(P.i+170>nextSpawn){spawnAt(nextSpawn,diff);nextSpawn+=Math.round(rnd(40,66)*(1-diff*.4));}}
  updateObjects(dt,playing);
  if(playing)collide();
  objs=objs.filter(o=>!o.dead&&(o.role==='over'?o.i<P.i+420:true)&&(o.i===undefined||o.i>P.i-130));
  for(let k=0;k<2;k++){const x=camX+rnd(0,W),y=camY+rnd(0,H),n=nearestIT(x,y);if(n.t<-12)sparks.push({x,y,vx:Math.cos(PA[n.i])*24,vy:Math.sin(PA[n.i])*24,life:1.4,w:rnd(2,5)|0});}
  for(const s of sparks){s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;}sparks=sparks.filter(s=>s.life>0);
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;if(!p.flat&&!p.nog)p.vy+=260*dt;p.life-=dt;}parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=16*dt;p.life-=dt*.7;}pops=pops.filter(p=>p.life>0);
  // chunk housekeeping: build what is on screen now, one extra ahead, drop far ones
  const c0=Math.floor(camX/CH),c1=Math.floor((camX+W)/CH),r0=Math.floor(camY/CH),r1=Math.floor((camY+H)/CH);
  for(let cy=r0;cy<=r1;cy++)for(let cx=c0;cx<=c1;cx++)chunkAt(cx,cy,true);let built=0;for(let cy=r0-1;cy<=r1+1&&!built;cy++)for(let cx=c0-1;cx<=c1+1&&!built;cx++)if(!chunks.has(cx+','+cy)){chunkAt(cx,cy,true);built=1;}
  if(chunks.size>60)for(const k of chunks.keys()){const[a,b]=k.split(',').map(Number);if(Math.abs(a-(c0+c1)/2)>4||Math.abs(b-(r0+r1)/2)>4)chunks.delete(k);}
}

/* ---------- drawing ---------- */
function txt(s,x,y,col='#fcfcfc',al='left',size=8){ctx.font=size+'px '+FONT;ctx.textAlign=al;ctx.textBaseline='top';ctx.fillStyle='#000';ctx.fillText(s,x+1,y+1);ctx.fillStyle=col;ctx.fillText(s,x,y);}
function bubble(s,x,y){ctx.font='8px '+FONT;const w=Math.ceil(ctx.measureText(s).width)+6;
  const bx=clamp(Math.round(x-w/2),2,W-w-2),by=clamp(Math.round(y-16),22,H-14),tx=clamp(Math.round(x),bx+3,bx+w-4);

  ctx.fillStyle='#fcfcfc';ctx.fillRect(bx,by,w,11);ctx.fillRect(tx-1,by+11,3,2);

function line(x0,y0,x1,y1,th,col){ctx.fillStyle=col;const dx=x1-x0,dy=y1-y0,n=Math.max(1,Math.ceil(Math.max(Math.abs(dx),Math.abs(dy)))),o=Math.floor(th/2);

const SX=x=>Math.round(x-camX),SY=y=>Math.round(y-camY);
function personAt(o,fc,sit,fr,sx,sy){ctx.drawImage(personSprite(o,fc,sit,fr),Math.round(sx)-15,Math.round(sy)-35);}

function singlePaddle(sx,sy,a,sit,ph,blade){const s=Math.sin(ph),side=s>0?1:-1,nx=-Math.sin(a),ny=Math.cos(a)*.6,dx=Math.cos(a),dy=Math.sin(a)*.6;

  const e1=[sx+nx*25+dx,hy+ny*25+dy],e2=[sx-nx*25-dx,hy-ny*25-dy];line(e1[0],e1[1],e2[0],e2[1],2,'#1e1e22');
  for(const[e,o]of[[e1,1],[e2,-1]]){const bx=e[0]-nx*o*7,by=e[1]-ny*o*7;line(bx,by,e[0],e[1],6,'#2a160a');line(bx,by,e[0],e[1],4,'#e8601c');}}
function drawRider(o){const q=riderPos(o),sx=SX(q.x),sy=SY(q.y);if(sx<-60||sx>W+60||sy<-60||sy>H+60)return;
  if(o.fallen){const e=o.role==='boat'?capsizedImg(q.a+o.fallT*.4):boardImg(o.b,q.a+o.fallT*1.1);ctx.drawImage(e.img,sx-e.img.m,sy-e.img.m);
    if(o.dog)ctx.drawImage(flipDog(o.dog,Math.floor(t*4)%2,'e'),sx-10,sy-12);
    const nx=-Math.sin(q.a),ny=Math.cos(q.a),s=(o.swimSide||1)*(14+Math.min(10,o.fallT*8));

    else{swimTop(sx+nx*s,sy+ny*s*.7,o.p);if(o.shoulder||o.front)swimTop(sx+nx*s*1.7,sy+ny*s*1.1,o.shoulder||o.front,.75);if(o.p2)swimTop(sx-nx*s,sy-ny*s*.7,o.p2);}
    if(o.fallT>.3&&o.fallT<2.4)bubble(o.role==='over'?'БУЛЬ-БУЛЬ!':o.role==='boat'?'НАШЕ ПИВО!!!':'ЭЙ, ТИГР!',sx,sy-16);

  if(o.role==='boat'){boardAt(boatImg(q.a),sx,sy,0);const dx=Math.cos(q.a),dy=Math.sin(q.a);

  else personAt(o.p,fc,o.sit,fr,sx,sy+2);

function flipDog(kind,fr,fc,pose){const c=dogSprite(kind,fr,pose);if(fc!=='w')return c;const k='dogf'+kind+fr+(pose||'sit');let f=PC.get(k);if(!f){f=flip(c);PC.set(k,f);}return f;}

  const wob=!P.sit&&P.h===0?Math.round(Math.sin(t*5)):0,sx=SX(P.x)+wob,sy=SY(P.y),h=Math.round(P.h),e=boardImg(BD.hero,P.a);
  if(h>0){ell(sx,sy+2,15,4,'rgba(6,40,58,.45)');ctx.drawImage(e.img,sx-e.img.m,sy-e.img.m-h);}else boardAt(e,sx,sy,0);
  const fc=facingOf(P.a),sit=P.trans>0?true:P.sit;
  const swing=()=>{const k=1-strikeT/.36,ang=P.a+Math.PI/2-k*Math.PI,cy=sy-h-12,ex=sx+Math.cos(ang)*30,ey=cy+Math.sin(ang)*18;
    line(sx,cy,ex,ey,2,'#1e1e22');line(ex-Math.cos(ang)*8,ey-Math.sin(ang)*5,ex,ey,6,'#2a160a');line(ex-Math.cos(ang)*8,ey-Math.sin(ang)*5,ex,ey,4,'#e8601c');
    ctx.fillStyle='rgba(255,255,255,.75)';for(let j=1;j<6;j++){const a2=ang+j*.22;ctx.fillRect(Math.round(sx+Math.cos(a2)*33),Math.round(cy+Math.sin(a2)*20),2,1);}};
  if(fc==='n'&&!(strikeT>0))heroPaddle(sx,sy-h,P.a,sit,P.phase);
  const dogAt=()=>{if(!P.dogs.length)return;const e=Math.sin(P.a)<0?-1:1,ca=Math.cos(P.a),sa=Math.sin(P.a);
    const spots=[[16,0],[10,-7],[10,7],[3,-8]];const L=P.dogs.map((g,k)=>{const u=spots[k][0]*e,v=spots[k][1];return{g,x:sx+Math.round(ca*u-sa*v),y:sy+Math.round((sa*u+ca*v)*.8)+4-h};}).sort((a2,b2)=>a2.y-b2.y);
    for(const z of L)ctx.drawImage(flipDog(z.g.kind,Math.floor(t*4+z.x)%2,fc,z.g.pose),z.x-11,z.y-15);

  personAt(heroP(),fc,sit,0,sx,sy+2-h);

function drawObj(o){

  [['← →','ПОВОРОТ'],['↑ / ↓','ГРЕСТИ / ТОРМОЗ'],['SHIFT, Z','ВСТАТЬ / СЕСТЬ'],['ПРОБЕЛ, X','ПРЫЖОК (ТОЛЬКО СТОЯ)'],['C','БРОСИТЬ ВЕЩЬ'],['ДЕРЖАТЬ C','ВОДЯНОЕ РУЖЬЁ (НЕ РУЛИШЬ)'],['Q','СМЕНИТЬ ВЕЩЬ'],['V','УДАР ВЕСЛОМ'],['P / M','ПАУЗА / ЗВУК']]
    .forEach((rw,k)=>{txt(rw[0],18,44+k*13,'#f8d030');txt(rw[1],100,44+k*13,'#fcfcfc');});
  txt('ВЕСЛОМ 2 РАЗА - САПЕР В ВОДЕ',CX,166,'#a4e4fc','center');
  txt('ПОД НИЗКИМ МОСТОМ - СИДЯ!',CX,178,'#f87858','center');
  txt('НАСОСЫ = ЖИЗНИ, ЛОВИ ИХ НА ВОДЕ',CX,190,'#a4e4fc','center');
  txt('ТЕЛЕФОН: A ПРЫЖОК  B ВСТАТЬ',CX,204,'#c8c8c8','center');
  txt('C БРОСОК  D ВЕСЛО  ВЕЩЬ',CX,215,'#c8c8c8','center');
  if(Math.floor(t*2)%2)txt('ENTER - НАЗАД',CX,226,'#f8b800','center');}
function drawOver(){panel(62,90);txt('ПРОПЛЫЛ '+kmNow()+' КМ',CX,118,'#a4e4fc','center');
  txt('ЗАПЛЫВ ОКОНЧЕН',CX,74,'#f8b800','center');
  txt('СЧЁТ   '+String(Math.max(0,score())).padStart(6,'0'),CX,92,'#fcfcfc','center');
  txt('РЕКОРД '+String(best).padStart(6,'0'),CX,106,score()>=best&&best>0?'#f8b800':'#a4e4fc','center');
  if(overT>FALL_LEN+.5&&Math.floor(t*2)%2)txt('ENTER - ЕЩЁ РАЗ',CX,134,'#f8d030','center');}

/* ---------- input ---------- */
function startGame(){initAudio();resetWorld();state='play';P.dogs=[];P.dogSay=0;lives=6;for(const k of ITEMS)INV[k]=0;INV.beer=3;K.fire=0;sel='beer';strikeT=0;inv=1.5;bonus=0;parts=[];pops=[];hinted={};
  banner={text:'C - БРОСОК  Q - ВЕЩЬ  V - ВЕСЛО',t:4};step=0;sfx.start();}
function press(){initAudio();
  if(state==='intro'){state='title';parts=[];}
  else if(state==='title'){if(menuSel===0)startGame();else state='controls';}
  else if(state==='controls')state='title';
  else if(state==='over'){if(overT<FALL_LEN)overT=FALL_LEN;else if(overT>FALL_LEN+.5)startGame();}
  else if(state==='pause')state='play';}
const KEYMAP={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',ArrowUp:'u',KeyW:'u',ArrowDown:'d',KeyS:'d'};
addEventListener('keydown',e=>{
  if(KEYMAP[e.code]){K[KEYMAP[e.code]]=1;e.preventDefault();}
  if(state==='title'&&!e.repeat&&(e.code==='ArrowUp'||e.code==='ArrowDown'||e.code==='KeyW'||e.code==='KeyS')){menuSel^=1;sfx.mode();}
  if(e.code==='Escape'&&state==='controls')state='title';
  if(e.code==='Enter'){e.preventDefault();if(!e.repeat)press();}
  if(e.code==='Space'||e.code==='KeyX'||e.code==='KeyK'){e.preventDefault();if(!e.repeat){if(state==='play')jumpQ=true;else press();}}
  if((e.code==='ShiftLeft'||e.code==='ShiftRight'||e.code==='KeyZ'||e.code==='KeyJ')&&!e.repeat&&state==='play')modeQ=true;
  if(state==='play'&&!e.repeat){if(e.code==='KeyC'){K.fire=1;if(sel!=='gun')throwQ=true;}if(e.code==='KeyV')hitQ=true;if(e.code==='KeyQ'||e.code==='Tab'){e.preventDefault();itemQ=true;}}
  if(e.code==='KeyP'&&!e.repeat){if(state==='play')state='pause';else if(state==='pause')state='play';}
  if(e.code==='KeyM'&&!e.repeat)toggleMute();});
addEventListener('keyup',e=>{if(KEYMAP[e.code])K[KEYMAP[e.code]]=0;if(e.code==='KeyC')K.fire=0;});
addEventListener('blur',()=>{K.l=K.r=K.u=K.d=K.fire=0;if(state==='play')state='pause';});
cv.addEventListener('pointerdown',e=>{if(state==='title'){const y=e.offsetY/cv.clientHeight*H;if(y>78&&y<=97)menuSel=0;else if(y>97&&y<116)menuSel=1;}if(state!=='play')press();});
document.querySelectorAll('.pad button').forEach(b=>{const k=b.dataset.k;
  const on=e=>{e.preventDefault();initAudio();b.classList.add('on');if(state==='title'&&(k==='u'||k==='d')){menuSel^=1;sfx.mode();return;}if(k==='start')press();else if(k==='jump'){if(state==='play')jumpQ=true;else press();}else if(k==='mode'){if(state==='play')modeQ=true;}else if(k==='throw'){if(state==='play'){K.fire=1;if(sel!=='gun')throwQ=true;}}else if(k==='hit'){if(state==='play')hitQ=true;}else if(k==='item'){if(state==='play')itemQ=true;}else K[k]=1;};
  const off=()=>{b.classList.remove('on');if(K[k]!==undefined)K[k]=0;if(k==='throw')K.fire=0;};
  b.addEventListener('pointerdown',on);['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,off));b.addEventListener('contextmenu',e=>e.preventDefault());});
const muteBtn=document.getElementById('mute');
function toggleMute(){muted=!muted;muteBtn.textContent='ЗВУК: '+(muted?'ВЫКЛ':'ВКЛ');}
muteBtn.addEventListener('click',()=>{initAudio();toggleMute();muteBtn.blur();});

/* ---------- loop ---------- */
resetWorld();
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
